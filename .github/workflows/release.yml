name: Create Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs: {}

jobs:
  build:
    # No commit-message gate: semantic-release already decides whether a push
    # warrants a release, and it reads the commits properly.
    #
    # This used to be a list of `contains(..., 'fix:')` checks, which quietly
    # dropped every scoped conventional commit: `fix(auth):` does not contain
    # the substring `fix:`. Releases were therefore skipped for most of the
    # repo's actual history, with no failure anywhere to show for it. A skipped
    # job looks exactly like a job that decided not to release, which is what
    # made it survive so long.
    #
    # Running semantic-release unconditionally costs a minute and it exits
    # cleanly when there is nothing to publish.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # Required for npm trusted publishing (OIDC)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) needs npm >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/github @semantic-release/changelog @semantic-release/git @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/npm

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # NODE_AUTH_TOKEN is what actually authenticates the npm publish, and its
      # absence is why nothing has reached npm since 17 Aug 2026.
      #
      # c277ea0 switched this job to npm trusted publishing (OIDC) and removed
      # the token, but the matching trusted publisher was never registered on
      # npmjs.com. So every run since has died in verifyConditions:
      #
      #   OIDC token exchange with the npm registry failed:
      #     404 OIDC token exchange error - package not found
      #   npm error 401 Unauthorized - GET .../-/whoami
      #   EINVALIDNPMTOKEN Invalid npm token.
      #
      # semantic-release tries OIDC, falls back to token auth, finds no token,
      # and refuses to run. Nine consecutive pushes to main failed this way
      # while npm kept serving 1.7.4, whose server still self-reports 1.3.5.
      #
      # This restores the credential that worked before that switch. It is
      # deliberately temporary: npm withdraws direct-publish rights from
      # 2FA-bypass granular tokens in Jan 2027, so register the trusted
      # publisher (muammar-yacoob / GMail-Manager-MCP / release.yml,
      # environment blank) and drop NODE_AUTH_TOKEN before then.
      #
      # No --provenance: npm only accepts a sigstore bundle once a trusted
      # publisher exists, so requesting it now fails E422 after a green build.
      - name: Semantic Release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npx semantic-release

      # A no-release run exits 0, which is indistinguishable from a successful
      # release unless you say so. That ambiguity is how the substring gate
      # above hid a month of unreleased work. If a push changed src/ and
      # semantic-release still published nothing, that is almost always a
      # commit that skipped conventional-commit syntax, so make it loud.
      - name: Report no release
        if: steps.semantic-release.outputs.new_release_published != 'true'
        run: |
          echo "semantic-release published nothing for ${{ github.sha }}."
          # github.event.before is empty on workflow_dispatch and all-zeros on
          # a branch's first push, so only diff when it names a real commit.
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             && git diff --name-only "$BEFORE" "${{ github.sha }}" | grep -q '^src/'; then
            echo "::warning title=Unreleased changes::This push changed src/ but semantic-release produced no release, so npm is still on the previous version. Check the commit subjects use conventional-commit syntax (feat:, fix:)."
          fi

      - name: Confirm published version
        if: steps.semantic-release.outputs.new_release_published == 'true'
        run: |
          VERSION="${{ steps.semantic-release.outputs.new_release_version }}"
          echo "Released v$VERSION. Confirming npm is serving it."
          for i in 1 2 3 4 5 6; do
            NPM_VERSION=$(npm view @spark-apps/gmail-manager-mcp version 2>/dev/null || echo "none")
            if [ "$NPM_VERSION" = "$VERSION" ]; then
              echo "npm now serves @spark-apps/gmail-manager-mcp@$NPM_VERSION."
              exit 0
            fi
            echo "npm reports $NPM_VERSION, waiting for $VERSION (attempt $i)."
            sleep 10
          done
          echo "::error title=Release did not reach npm::semantic-release reported v$VERSION but npm still serves $NPM_VERSION."
          exit 1
